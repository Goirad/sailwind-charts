# The island catalogue: real (in-game) names, status, per-island quirks, composites.  One table per island, keyed by the
# developer object name from the game data (see `python -I charts.py list`).
#
#   name    title and file name of the chart (blank = the object name)
#   region  the button group on the site; must be one of [site].regions (islands that are skipped need none)
#   mod     true = added by a mod (only exists with --mods)
#   skip    true = leave out of `render --all` (leftovers, inactive objects, composite members)
#   status  validated (checked against the game) | checked (looked at closely) | doubtful (known or suspected problem)
#   notes   free text: what was learned, what is open
#   quirks  per-island overrides, always scoped to one island (they would damage other maps):
#             floor_split         [mesh names]  waterline-crossing triangles near the footprint are ground (dry dock floors)
#             extra_struct_regex  "regex"       object names to force into structures (L24 solid meshes only)
#             extra_land          [names]       objects to force into the ground even without a collider
#             land_names          [names]       meshes that the name rules would call structures but are ground
#             nodata_is_water     true          enclosed cells without data are open water, not grey "no data"
#
# Composites are islands that are one place in the game and are charted as ONE map, in their true relative positions.

[site]
title = "Sailwind Bathymetry Charts"
author = "Stelaro"
repo_url = ""
# Button groups on the site, in display order.  Islands inside a group are sorted by name.  Fill this in, then set `region` on each island.
regions = ["Al'Ankh", "Aestrin", "Emerald Archipelago", "Fire Fish Lagoon", "Other", "Spoiler!"]
# Regions whose buttons start hidden (spoilers); every other region starts open.  Both are collapsible on the page.
collapsed = ["Spoiler!"]

[islands."island 1 A (gold rock)"]
name = "Gold Rock City"
region = "Al'Ankh"
status = "validated"
notes = "Quirk floor_split: the dry dock floor/ramp inside mesh arab_shipyard is ground, not structure (the bay was hidden before). The quay slab may include \"dock col\" collision proxies (judged right). The Terrain has its own scale 2.0, so it was never hit by the Terrain-placement bug. The mesh skirts form flat depth planes (9.7 m and 9.0 m) that must not set the crop."
[islands."island 1 A (gold rock)".quirks]
floor_split = ["L24:arab_shipyard"]

